<div
  class="bg-red-50 shadow-md p-4 sm:rounded-none sm:h-full md:rounded-2xl md:max-w-xl md:mx-auto md:my-6 md:h-auto w-full h-screen overflow-auto transition-all"
>
  <h2 class="text-xl font-semibold text-center mb-4 text-red-700">
    Rutina del {{ dayDate() | date : "EEEE" }}
  </h2>

  @if (isGlobalResting()) {
  <div class="text-center text-blue-500 font-semibold mb-4">
    🕒 Descanso entre ejercicios: {{ globalCountdown() }}s
  </div>
  }

  <ul class="divide-y divide-gray-200">
    @for (exercise of exercises(); track exercise.id) {
    <app-exercise-item
      [exercise]="exercise"
      [isGlobalResting]="isGlobalResting()"
      (exerciseCompleted)="onExerciseCompleted()"
    />
    }
  </ul>
</div>
