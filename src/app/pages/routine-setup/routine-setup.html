<div
  class="bg-red-50 shadow-md p-4 sm:rounded-none sm:h-full md:rounded-2xl md:max-w-xl md:mx-auto md:my-6 md:h-auto w-full h-screen overflow-auto transition-all"
>
  <h2 class="text-xl font-semibold text-center mb-4 text-red-700">
    Configurar rutina
  </h2>

  <ul class="flex flex-col">
    @for (day of routineDays(); track day.id) {
    <li
      class="flex justify-between items-center w-full px-6 py-4 rounded-lg text-lg text-red-700 font-medium hover:bg-red-100 transition-all duration-200 border-b border-red-100"
    >
      <div class="flex items-center gap-2">
        <input
          class="h-5 w-5 mr-3 cursor-pointer"
          type="checkbox"
          [name]="day.name"
          [id]="day.id"
          [checked]="day.is_active"
          (change)="toggleDay(day.id)"
        />
        <label [for]="day.id">{{ day.name }}</label>
      </div>

      <a [routerLink]="['/routine-details-setup', day.id]">
        <app-icon name="cog" />
      </a>
    </li>
    }
  </ul>
</div>
