<nav
  class="fixed top-0 left-0 w-full md:w-2/3 h-full bg-gradient-to-b from-red-100 via-red-50 to-white shadow-2xl z-50 py-8 px-2 overflow-y-auto"
>
  <button
    class="absolute top-6 right-6 text-red-800 hover:text-red-600 transition cursor-pointer"
    (click)="toggleMenu()"
    aria-label="Cerrar menú"
  >
    <app-icon name="close" class="w-8 h-8" />
  </button>

  <h3 class="px-6 text-2xl font-semibold text-red-700 mb-6">Días de rutina</h3>

  <ul class="flex flex-col">
    <li (click)="toggleMenu()">
      <a
        [routerLink]="['home']"
        [routerLinkActive]="['bg-red-200']"
        class="flex items-center gap-2 w-full px-6 py-4 rounded-lg text-lg text-red-700 font-medium hover:bg-red-100 transition-all duration-200 border-y border-red-100"
      >
        <app-icon name="home" /> Inicio
      </a>
    </li>
    @for(day of routineDays(); track day.id) { @if (day.is_active) {
    <li (click)="toggleMenu()">
      <a
        [routerLink]="['/routine-details', day.id]"
        [routerLinkActive]="['bg-red-200']"
        class="flex items-center gap-2 w-full px-6 py-4 rounded-lg text-lg text-red-700 font-medium hover:bg-red-100 transition-all duration-200 border-b border-red-100"
      >
        <app-icon name="calendar" /> {{ day.name }}
      </a>
    </li>
    } }
    <li (click)="toggleMenu()">
      <a
        [routerLink]="['routine-setup']"
        [routerLinkActive]="['bg-red-200']"
        class="flex items-center gap-2 w-full px-6 py-4 rounded-lg text-lg text-red-700 font-medium hover:bg-red-100 transition-all duration-200 border-b border-red-100"
      >
        <app-icon name="cog" /> Configurar rutina
      </a>
    </li>
  </ul>
</nav>
