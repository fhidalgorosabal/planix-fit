<nav
  class="fixed top-0 left-0 w-full md:w-2/3 h-full bg-gradient-to-b from-red-100 via-red-50 to-white shadow-2xl z-50 py-8 px-2 overflow-y-auto"
>
  <button
    class="absolute top-6 right-6 text-red-800 hover:text-red-600 transition cursor-pointer"
    (click)="toggleMenu()"
    aria-label="Cerrar menú"
  >
    <svg
      width="28"
      height="28"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <line x1="6" y1="6" x2="22" y2="22" />
      <line x1="6" y1="22" x2="22" y2="6" />
    </svg>
  </button>

  <h3 class="px-6 text-2xl font-semibold text-red-700 mb-6">Días de rutina</h3>

  <ul class="flex flex-col">
    <li (click)="toggleMenu()">
      <a
        [routerLink]="['home']"
        [routerLinkActive]="['bg-red-200']"
        class="flex items-center gap-2 w-full px-6 py-4 rounded-lg text-lg text-red-700 font-medium hover:bg-red-100 transition-all duration-200 border-y border-red-100"
      >
        <svg
          class="w-6 h-6"
          data-slot="icon"
          fill="none"
          stroke-width="1.5"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"

          ></path>
        </svg>
        Inicio
      </a>
    </li>
    @for(day of routineDays(); track day.id) { @if (day.isActive) {
    <li (click)="toggleMenu()">
      <a
        [routerLink]="['/routine-details', day.id]"
        [routerLinkActive]="['bg-red-200']"
        class="flex items-center gap-2 w-full px-6 py-4 rounded-lg text-lg text-red-700 font-medium hover:bg-red-100 transition-all duration-200 border-b border-red-100"
      >
        <svg
          class="w-6 h-6"
          data-slot="icon"
          fill="none"
          stroke-width="1.5"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"
          ></path>
        </svg>
        {{ day.name }}
      </a>
    </li>
    } }
    <li (click)="toggleMenu()">
      <a
        [routerLink]="['routine-setup']"
        [routerLinkActive]="['bg-red-200']"
        class="flex items-center gap-2 w-full px-6 py-4 rounded-lg text-lg text-red-700 font-medium hover:bg-red-100 transition-all duration-200 border-b border-red-100"
      >
        <svg
          class="w-6 h-6"
          data-slot="icon"
          fill="none"
          stroke-width="1.5"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"

          ></path>

            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          ></path>
        </svg>
        Configurar rutina
      </a>
    </li>
  </ul>
