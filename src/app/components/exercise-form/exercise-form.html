<div class="space-y-3">
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
    <ng-select
      [items]="exerciseBaseList"
      bindLabel="name"
      bindValue="id"
      placeholder="Selecciona un ejercicio"
      [searchable]="true"
      [(ngModel)]="model.name"
      class="w-full px-3 py-2 border border-gray-300 rounded-md active:outline-none active:ring-2 active:ring-red-500"
      name="name"
    ></ng-select>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Cantidad</label
      >
      <input
        type="number"
        [(ngModel)]="model.reps"
        name="reps"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"
        min="1"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Series</label>
      <input
        type="number"
        [(ngModel)]="model.sets"
        name="sets"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"
        min="1"
      />
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Unidad</label>
    <ng-select
      [items]="['Repeticiones', 'Minutos']"
      [(ngModel)]="model.unit"
      name="unit"
      [searchable]="true"
      class="w-full px-3 py-2 border border-gray-300 rounded-md active:outline-none active:ring-2 active:ring-red-500"
    ></ng-select>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Descanso</label
      >
      <input
        type="number"
        [(ngModel)]="model.restTime"
        name="restTime"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"
        min="0"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Descanso al terminar</label
      >
      <input
        type="number"
        [(ngModel)]="model.restTimeSet"
        name="restTimeSet"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"
        min="0"
      />
    </div>
  </div>

  <div class="flex justify-end space-x-3 mt-4">
    <button
      (click)="cancel.emit()"
      class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors cursor-pointer"
    >
      Cancelar
    </button>
    <button
      (click)="save.emit(model)"
      class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors cursor-pointer"
    >
      {{ isEdit ? "Guardar" : "Adicionar" }}
    </button>
  </div>
</div>
