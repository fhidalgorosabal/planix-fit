<header class="flex items-center px-4 py-2 bg-blue-600 relative">
  <!-- Toggle Menu Button -->
  <button
    class="mr-3 text-white focus:outline-none cursor-pointer"
    (click)="menuOpen = !menuOpen"
    aria-label="Abrir menú"
  >
    <!-- Icono hamburguesa -->
    <svg
      width="24"
      height="24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
  <!-- Título -->
  <h1 class="text-white text-lg font-semibold">
    <ng-content></ng-content>
  </h1>
  <!-- Menú lateral -->
  @if (menuOpen) {
  <app-menu (menuOpen)="toggleMenu()"></app-menu>
  }
</header>
